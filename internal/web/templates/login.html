{{define "content"}}
<div class="login-shell" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#181a1f;">
    <form method="POST" action="/login" class="login-card" style="background:#23262d;border:1px solid #2e313a;border-radius:10px;padding:2em 2.2em;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,0.4);">
        <div style="text-align:center;margin-bottom:1.5em;">
            <img src="/static/logo.svg" alt="" style="width:48px;height:48px;margin-bottom:.5em;">
            <h1 style="font-size:1.4em;margin:0;color:#f0f0f0;">Audplexus</h1>
            <p style="color:#888;font-size:.9em;margin:.3em 0 0;">Sign in to continue</p>
        </div>

        {{if .Error}}
        <div role="alert" style="background:#3a1414;border:1px solid #b03a3a;color:#f08585;padding:.5em .8em;border-radius:5px;margin-bottom:1em;font-size:.9em;">{{.Error}}</div>
        {{end}}

        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="returnUrl" value="{{.ReturnURL}}">

        <label style="display:block;margin-bottom:1em;">
            <span style="display:block;font-size:.85em;color:#bbb;margin-bottom:.3em;">Username</span>
            <input type="text" name="username" autocomplete="username" required autofocus
                   style="width:100%;box-sizing:border-box;padding:.6em .8em;background:#1a1c21;border:1px solid #3a3d45;color:#f0f0f0;border-radius:5px;font-size:1em;">
        </label>

        <label style="display:block;margin-bottom:1.3em;">
            <span style="display:block;font-size:.85em;color:#bbb;margin-bottom:.3em;">Password</span>
            <input type="password" name="password" autocomplete="current-password" required
                   style="width:100%;box-sizing:border-box;padding:.6em .8em;background:#1a1c21;border:1px solid #3a3d45;color:#f0f0f0;border-radius:5px;font-size:1em;">
        </label>

        <button type="submit"
                style="width:100%;padding:.7em;background:#4a90e2;border:0;color:#fff;border-radius:5px;font-size:1em;font-weight:600;cursor:pointer;">
            Sign In
        </button>

        {{if .OIDCEnabled}}
        <div style="display:flex;align-items:center;gap:.6em;margin:1.2em 0;color:#666;font-size:.8em;">
            <span style="flex:1;height:1px;background:#3a3d45;"></span>or<span style="flex:1;height:1px;background:#3a3d45;"></span>
        </div>
        <a href="{{.OIDCLoginURL}}"
           style="display:block;text-align:center;width:100%;box-sizing:border-box;padding:.7em;background:#2e313a;border:1px solid #3a3d45;color:#f0f0f0;border-radius:5px;font-size:1em;font-weight:600;text-decoration:none;">
            Sign in with {{.OIDCProviderName}}
        </a>
        {{end}}

        {{if .LockedUntil}}
        <p style="color:#f08585;font-size:.85em;margin:1em 0 0;text-align:center;">Too many attempts. Try again at {{.LockedUntil}}.</p>
        {{end}}
    </form>
</div>
{{end}}
