name: audplexus-codeql

disable-default-queries: false

# Accepted-risk findings for this self-hosted architecture:
# - go/request-forgery: user-configured media-server destinations are core functionality.
# - go/cookie-secure-not-set: localhost/LAN HTTP deployments are intentionally supported.
query-filters:
  - exclude:
      id: go/request-forgery
  - exclude:
      id: go/cookie-secure-not-set

paths-ignore:
  - .tools/**
  - build/**
  - docs/**
  - test-results/**
  - audplexus/**
