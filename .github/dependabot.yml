version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init/analyze/autobuild must land in one PR — a split merge leaves a
      # commit with mismatched CodeQL Action versions, which fails the run.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
        update-types:
          - "minor"
          - "patch"
      codeql-action-major:
        patterns:
          - "github/codeql-action/*"
        update-types:
          - "major"
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"