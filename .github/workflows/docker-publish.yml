name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Resolve build version metadata
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            BUILD_CHANNEL="release"
          else
            RELEASE_VERSION="$(git tag --sort=-version:refname | sed -n '1s/^v//p')"
            if [[ -z "${RELEASE_VERSION}" ]]; then
              RELEASE_VERSION="0.0.0"
            fi
            BUILD_CHANNEL="dev"
          fi
          BUILD_COMMIT_REF="$(git rev-parse --short=12 HEAD)"
          BUILD_TIMESTAMP="$(date -u +%Y%m%d%H%M%S)"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_channel=${BUILD_CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "build_commit_ref=${BUILD_COMMIT_REF}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            BUILD_RELEASE_VERSION=${{ steps.ver.outputs.release_version }}
            BUILD_COMMIT_REF=${{ steps.ver.outputs.build_commit_ref }}
            BUILD_TIMESTAMP=${{ steps.ver.outputs.build_timestamp }}
            BUILD_CHANNEL=${{ steps.ver.outputs.build_channel }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  publish:
    needs:
      - tests
      - build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Resolve build version metadata
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            BUILD_CHANNEL="release"
          else
            RELEASE_VERSION="$(git tag --sort=-version:refname | sed -n '1s/^v//p')"
            if [[ -z "${RELEASE_VERSION}" ]]; then
              RELEASE_VERSION="0.0.0"
            fi
            BUILD_CHANNEL="dev"
          fi
          BUILD_COMMIT_REF="$(git rev-parse --short=12 HEAD)"
          BUILD_TIMESTAMP="$(date -u +%Y%m%d%H%M%S)"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_channel=${BUILD_CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "build_commit_ref=${BUILD_COMMIT_REF}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_RELEASE_VERSION=${{ steps.ver.outputs.release_version }}
            BUILD_COMMIT_REF=${{ steps.ver.outputs.build_commit_ref }}
            BUILD_TIMESTAMP=${{ steps.ver.outputs.build_timestamp }}
            BUILD_CHANNEL=${{ steps.ver.outputs.build_channel }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

